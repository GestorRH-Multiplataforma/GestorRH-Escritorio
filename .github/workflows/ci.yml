name: CI Escritorio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Compile (Perfil DEV)
        run: mvn -B clean verify -P dev

      - name: Crear application-prod.properties
        env:
          GESTORRH_API_URL: ${{ secrets.GESTORRH_API_URL }}
        run: |
          cat > src/main/resources/config/application-prod.properties << EOF
          gestorrh.api.url=${GESTORRH_API_URL}
          log.level=WARN
          pdf.output.dir=reportes_pdf
          EOF

      - name: Verify compilation (Perfil PROD)
        run: mvn -B clean verify -P prod