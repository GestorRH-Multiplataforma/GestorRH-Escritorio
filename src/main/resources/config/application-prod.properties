# ============================================================
# GestorRH Escritorio ? Configuración de PRODUCCIÓN
# ============================================================
# Este archivo NO contiene valores sensibles.
# Todas las propiedades críticas se leen desde variables
# de entorno del sistema operativo donde se ejecuta la app.
#
# VARIABLES DE ENTORNO REQUERIDAS EN PRODUCCIÓN:
# -----------------------------------------------
# GESTORRH_API_URL  ? URL base de la API REST
#                     Ejemplo: https://api.gestorrh.com/
#
# GESTORRH_ENV      ? Debe ser "prod" para activar este perfil
#                     Ejemplo: prod
#
# INSTRUCCIONES DE DESPLIEGUE:
# -----------------------------------------------
# 1. Compilar con perfil de producción:
#    mvn clean verify -P prod
#
# 2. Establecer variables de entorno antes de ejecutar:
#    export GESTORRH_ENV=prod
#    export GESTORRH_API_URL=https://api.gestorrh.com/
#
# 3. Ejecutar la aplicación:
#    mvn javafx:run -P prod
#
# NOTAS:
# -----------------------------------------------
# - Si GESTORRH_API_URL no está definida, la app lanzará
#   IllegalStateException al arrancar.
# - El nivel de log en producción es WARN para reducir ruido.
# - El directorio de PDFs por defecto es 'reportes_pdf'
#   relativo al directorio de ejecución.
# ============================================================

log.level=WARN
pdf.output.dir=reportes_pdf